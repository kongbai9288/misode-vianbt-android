plugins {
	id 'com.android.library'
	id 'org.jetbrains.kotlin.android'
}

android {
	namespace 'io.misode.mobile'
	compileSdk 35

	defaultConfig {
		minSdk 23
		consumerProguardFiles 'consumer-rules.pro'
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}

	kotlinOptions {
		jvmTarget = '17'
	}

	buildTypes {
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
	}

	// The web bundle lives in src/main/assets/misode and is generated by CI.
	// Do not let AGP complain when it is missing during a source-only build.
	lint {
		abortOnError false
		checkReleaseBuilds false
	}

	packagingOptions {
		// The bundle contains .json / .mcmeta / .nbt data files.
		excludes += '/META-INF/{AL2.0,LGPL2.1}'
	}
}

dependencies {
	implementation 'androidx.webkit:webkit:1.12.1'
	implementation 'androidx.annotation:annotation:1.8.2'
	implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
