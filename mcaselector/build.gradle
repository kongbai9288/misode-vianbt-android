plugins {
	id 'com.android.library'
	id 'org.jetbrains.kotlin.android'
}

android {
	namespace 'net.querz.mcaselector'
	compileSdk 35

	defaultConfig {
		minSdk 26
		consumerProguardFiles 'consumer-rules.pro'
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}

	kotlinOptions {
		jvmTarget = '17'
	}

	buildTypes {
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
	}

	testOptions {
		unitTests.all {
			testLogging {
				events 'passed', 'failed', 'skipped'
				showStandardStreams = true
			}
		}
	}

	lint {
		abortOnError false
		checkReleaseBuilds false
	}
}

dependencies {
	// JSON: configs and version mappings. Small and Android friendly.
	implementation 'com.google.code.gson:gson:2.11.0'

	// Kotlin stdlib for the android.* helper layer.
	implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'

	// LZ4: modern .mca chunks are LZ4Block compressed. Pure Java, no JNI.
	implementation 'org.lz4:lz4-java:1.8.0'

	testImplementation 'junit:junit:4.13.2'
	testImplementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
}
