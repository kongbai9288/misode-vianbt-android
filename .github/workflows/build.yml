name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: 8.9

jobs:
  # ---------------------------------------------------------------- web bundle
  web:
    name: misode-web (offline bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: misode-web/package-lock.json

      - name: Install dependencies
        working-directory: misode-web
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Type check
        working-directory: misode-web
        run: npx tsc --noEmit || true

      - name: Build mobile bundle
        working-directory: misode-web
        run: npm run build:mobile

      - name: Package bundle
        working-directory: misode-web
        run: |
          cd dist-mobile
          zip -qr ../misode-web-assets.zip .

      - name: Report bundle size
        working-directory: misode-web
        run: du -sh dist-mobile && du -ah dist-mobile/assets | sort -rh | head -15

      - uses: actions/upload-artifact@v4
        with:
          name: misode-web-assets
          path: misode-web/misode-web-assets.zip
          if-no-files-found: error

  # ------------------------------------------------------------------- ViaNBT
  vianbt:
    name: vianbt (AAR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Gradle
        run: |
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip
          unzip -q gradle.zip -d /opt
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Assemble release AAR
        run: gradle :vianbt:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: vianbt-aar
          path: vianbt/build/outputs/aar/*.aar
          if-no-files-found: error

  # ----------------------------------------------------------- WebView wrapper
  misode-android:
    name: misode-android (AAR)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/download-artifact@v4
        with:
          name: misode-web-assets
          path: web-assets

      - name: Install Gradle
        run: |
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip
          unzip -q gradle.zip -d /opt
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Copy web bundle into assets
        run: |
          mkdir -p misode-android/src/main/assets/misode
          unzip -q web-assets/misode-web-assets.zip -d misode-android/src/main/assets/misode
          ls misode-android/src/main/assets/misode

      - name: Assemble release AAR
        run: gradle :misode-android:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: misode-android-aar
          path: misode-android/build/outputs/aar/*.aar
          if-no-files-found: error

  # ------------------------------------------------------------------- release
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [web, vianbt, misode-android]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.aar
          generate_release_notes: true
