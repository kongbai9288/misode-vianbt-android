name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  actions: write

env:
  GRADLE_VERSION: 8.9

jobs:
  # ---------------------------------------------------------------- web bundle
  web:
    name: misode-web (offline bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: misode-web/package-lock.json

      - name: Install dependencies
        working-directory: misode-web
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build mobile bundle
        working-directory: misode-web
        run: npm run build:mobile

      - name: Package bundle
        working-directory: misode-web
        run: |
          cd dist-mobile
          zip -qr ../misode-web-assets.zip .

      - name: Report bundle size
        working-directory: misode-web
        run: du -sh dist-mobile && du -ah dist-mobile/assets | sort -rh | head -15

      - uses: actions/upload-artifact@v4
        with:
          name: misode-web-assets
          path: misode-web/misode-web-assets.zip
          if-no-files-found: error

  # ------------------------------------------------------------------- ViaNBT
  vianbt:
    name: vianbt (AAR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Ensure Android SDK 35
        run: |
          yes 2>/dev/null | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          sdkmanager --list_installed 2>/dev/null | head -20 || true

      - name: Install Gradle
        run: |
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip
          unzip -q gradle.zip -d /opt
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Assemble release AAR
        run: |
          set -o pipefail
          gradle :vianbt:assembleRelease --stacktrace 2>&1 | tee /tmp/vianbt.log

      - name: Publish log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "no platforms dir"
          jq -n --arg t "CI log: vianbt ${{ github.run_number }}" --arg b "$(tail -c 50000 /tmp/vianbt.log)" '{title:$t,body:$b,labels:["ci-log"]}' > /tmp/issue.json
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues -d @/tmp/issue.json > /dev/null || true

      - name: Smoke test (JVM unit tests)
        run: |
          set -o pipefail
          gradle :vianbt:test --stacktrace 2>&1 | tee /tmp/vianbt-test.log

      - name: Verify AAR is dependency free
        run: |
          set -e
          AAR=$(find vianbt/build/outputs -name "*.aar" | head -1)
          echo "AAR: $AAR"
          rm -rf /tmp/aar && mkdir -p /tmp/aar && cd /tmp/aar && unzip -qo "$OLDPWD/$AAR"
          ls -la /tmp/aar
          mkdir -p /tmp/classes && cd /tmp/classes && unzip -qo /tmp/aar/classes.jar
          echo "class files: $(find /tmp/classes -name '*.class' | wc -l)"
          if grep -rl "unimi" /tmp/classes; then
            echo "::error::fastutil still referenced in the compiled output"
            exit 1
          fi
          echo "OK: no fastutil reference in the compiled classes"
          echo "AAR size: $(stat -c%s "$OLDPWD/$AAR") bytes"

      - name: Publish test report on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -n --arg t "CI log: vianbt test ${{ github.run_number }}" --arg b "$(tail -c 50000 /tmp/vianbt-test.log)" '{title:$t,body:$b,labels:["ci-log"]}' > /tmp/issue.json
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues -d @/tmp/issue.json > /dev/null || true

      - name: Collect AAR
        run: |
          mkdir -p out-vianbt
          find vianbt/build/outputs -name "*.aar" -exec cp {} out-vianbt/ \;
          ls -la out-vianbt

      - uses: actions/upload-artifact@v4
        with:
          name: vianbt-aar
          path: out-vianbt/
          if-no-files-found: error

  # ----------------------------------------------------------- WebView wrapper
  misode-android:
    name: misode-android (AAR)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Ensure Android SDK 35
        run: |
          yes 2>/dev/null | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true

      - uses: actions/download-artifact@v4
        with:
          name: misode-web-assets
          path: web-assets

      - name: Install Gradle
        run: |
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip
          unzip -q gradle.zip -d /opt
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Copy web bundle into assets
        run: |
          mkdir -p misode-android/src/main/assets/misode
          unzip -q web-assets/misode-web-assets.zip -d misode-android/src/main/assets/misode
          ls misode-android/src/main/assets/misode

      - name: Assemble release AAR
        run: |
          set -o pipefail
          gradle :misode-android:assembleRelease --stacktrace 2>&1 | tee /tmp/misode-android.log

      - name: Publish log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "no platforms dir"
          jq -n --arg t "CI log: misode-android ${{ github.run_number }}" --arg b "$(tail -c 50000 /tmp/misode-android.log)" '{title:$t,body:$b,labels:["ci-log"]}' > /tmp/issue.json
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues -d @/tmp/issue.json > /dev/null || true

      - name: Collect AAR
        run: |
          mkdir -p out-misode-android
          find misode-android/build/outputs -name "*.aar" -exec cp {} out-misode-android/ \;
          ls -la out-misode-android

      - uses: actions/upload-artifact@v4
        with:
          name: misode-android-aar
          path: out-misode-android/
          if-no-files-found: error

  # ------------------------------------------------------------- browser smoke
  smoke-web:
    name: smoke (mobile bundle in Chromium)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: misode-web/package-lock.json

      - name: Install dependencies
        working-directory: misode-web
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - uses: actions/download-artifact@v4
        with:
          name: misode-web-assets
          path: misode-web/dist-mobile

      - name: Unpack bundle
        working-directory: misode-web
        run: |
          cd dist-mobile
          unzip -qo misode-web-assets.zip
          rm -f misode-web-assets.zip
          ls -la
          du -sh .

      - name: Install Playwright chromium
        working-directory: misode-web
        run: npx playwright install chromium --with-deps

      - name: Run smoke test
        working-directory: misode-web
        run: |
          set -o pipefail
          npm run smoke 2>&1 | tee /tmp/smoke.log

      - name: Publish smoke log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -n --arg t "CI log: smoke ${{ github.run_number }}" --arg b "$(tail -c 50000 /tmp/smoke.log)" '{title:$t,body:$b,labels:["ci-log"]}' > /tmp/issue.json
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues -d @/tmp/issue.json > /dev/null || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: misode-web/dist-mobile/*.png
          if-no-files-found: ignore

  # ------------------------------------------------------------- MCA Selector
  mcaselector:
    name: mcaselector (AAR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Ensure Android SDK 35
        run: |
          yes 2>/dev/null | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true

      - name: Install Gradle
        run: |
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip
          unzip -q gradle.zip -d /opt
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Assemble release AAR
        run: |
          set -o pipefail
          gradle :mcaselector:assembleRelease --stacktrace 2>&1 | tee /tmp/mcaselector.log

      - name: Verify no desktop dependencies leaked in
        run: |
          set -e
          AAR=$(find mcaselector/build/outputs -name "*.aar" | head -1)
          rm -rf /tmp/mca && mkdir -p /tmp/mca/classes
          cd /tmp/mca && unzip -qo "$OLDPWD/$AAR"
          cd /tmp/mca/classes && unzip -qo /tmp/mca/classes.jar
          echo "class files: $(find /tmp/mca/classes -name '*.class' | wc -l)"
          if grep -rl "unimi\|javafx\|java/awt\|log4j" /tmp/mca/classes; then
            echo "::error::desktop dependency still referenced in the compiled output"
            exit 1
          fi
          echo "OK: no fastutil / javafx / awt / log4j in the compiled classes"

      - name: Publish log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -n --arg t "CI log: mcaselector ${{ github.run_number }}" --arg b "$(tail -c 50000 /tmp/mcaselector.log)" '{title:$t,body:$b,labels:["ci-log"]}' > /tmp/issue.json
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues -d @/tmp/issue.json > /dev/null || true

      - name: Collect AAR
        run: |
          mkdir -p out-mcaselector
          find mcaselector/build/outputs -name "*.aar" -exec cp {} out-mcaselector/ \;
          ls -la out-mcaselector

      - uses: actions/upload-artifact@v4
        with:
          name: mcaselector-aar
          path: out-mcaselector/
          if-no-files-found: error

  # ------------------------------------------------------------------- release
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [web, vianbt, misode-android, mcaselector, smoke-web]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.aar
            artifacts/**/*.png
          generate_release_notes: true
