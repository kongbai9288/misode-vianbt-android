plugins {
	id 'com.android.library'
}

android {
	namespace 'com.viaversion.nbt'
	compileSdk 35

	defaultConfig {
		minSdk 21
		// The library is pure Java: no resources, no manifest placeholders.
		consumerProguardFiles 'consumer-rules.pro'
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_1_8
		targetCompatibility JavaVersion.VERSION_1_8
	}

	buildTypes {
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
	}

	// java.nio.file based helpers (Path overloads) require API 26; the rest of the
	// library works down to API 21. Do not fail the release build on that lint check.
	lint {
		abortOnError false
		checkReleaseBuilds false
	}

	testOptions {
		unitTests.all {
			testLogging {
				events 'passed', 'failed', 'skipped'
				showStandardStreams = true
			}
		}
	}

	tasks.withType(Javadoc).configureEach {
		failOnError false
	}
}

dependencies {
	// Compile-time only annotations (@Nullable). Not shipped, not part of the dex.
	compileOnly 'org.jetbrains:annotations:24.1.0'

	// JVM unit tests only; nothing ships with the AAR.
	testImplementation 'junit:junit:4.13.2'
}
